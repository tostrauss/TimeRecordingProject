<div class="progress">
  <div *ngIf="percentage !== 0; else zerobar" class="progress-bar" role="progressbar" [style.width.%]="percentage" aria-valuenow="percentage" aria-valuemin="0"
    aria-valuemax="100">
    {{ percentage }}%
  </div>
  <ng-template #zerobar>
    <div class="progress-bar" style="background-color: grey;" role="progressbar" [style.width.%]="100" aria-valuenow="percentage" aria-valuemin="0"
      aria-valuemax="100">
      0%
    </div>
  </ng-template>
</div>

<div *ngFor="let tier of ProductTiers; let i = index" class="product-tier-card">
    <h1>
        {{tier.Title}}
    </h1>
    <hr>
    <h1>
        {{tier.Price ?  (Convert(tier.Price) | currency:'EUR') : "Priced by Request"}} <p> {{tier.Length ? '/' + tier.Length : "" }}</p>
    </h1>
    <div class="productInner">
        <p *ngFor="let includes of ProductInclusions"><ion-icon style="color: green;" [icon]="checkmark"></ion-icon> {{includes}}</p>
        <p *ngFor="let extras of tier.Extra"><ion-icon style="color: green;" [icon]="checkmark"></ion-icon> {{extras}}</p>
    </div>
    <br />
    <br />
    <ion-button (click)="onClick(i)">Instant Purchase</ion-button>
</div>

<div class="ClickMapHolder">
    <div *ngFor="let Item of ItemMap; let i = index;" class="InnerHolder">

        <!-- <img class="icon" [ngClass]="{
                'grey': i !== ActiveItem ,
                'completed': Item.Complete === true,
                'active': i === ActiveItem,
            }"  [src]="Image" style="width: 2rem; height: 2rem; position: absolute;"/> -->
        <div [ngClass]="{
            'grey': i !== ActiveItem ,
            'completed': Item.Complete === true,
            'active': i === ActiveItem,
        }">

            <ion-icon [icon]="CheckmarkOutline" class="icon"></ion-icon>


            <!-- <p>{{ Item.Title }}</p> -->
            <p>
                {{i + 1}}
            </p>
        </div>
        <hr [style]="'margin-left: ' + (100/ItemMap.length) + 'px; height: 0.2rem;'"
        *ngIf="i < ItemMap.length - 1">
        <!-- <hr [style]="'width:' + (50/ItemMap.length) + 'px; margin-left: ' + (100/ItemMap.length) + 'px; height: 0.2rem;'"
            *ngIf="i < ItemMap.length - 1"> -->
    </div>

</div>

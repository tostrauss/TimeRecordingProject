<div class="section" style="text-align:center;">
    <h1>
        {{Title}} 
    </h1>
    <br />
    <app-clock [clock]="targetDate"
        [timerStyle]="{ 'display': 'flex', 'justify-content': 'center' }" 
        [timeUnitStyle]="{ 'margin': '0 2px', 'width': '75px', 'background': '#00000021', 'padding': '0.5em', 'border-bottom': '2px solid white' }"
        [valueStyle]="{ 'font-size': '2em', 'color': 'var(--color)' }"
        [labelStyle]="{ 'font-size': '1em', 'color': '#6f6f6f' }"
        [useLongLabels]="true"
    >
    </app-clock>
    <br />
    <br />
    <p>
        {{Description}}
    </p>
</div>

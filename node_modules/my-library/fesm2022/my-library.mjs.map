<div class="modal" *ngIf="!IsUserLoggedIn">
  <div class="modal-content">
    <login-pop-up></login-pop-up>
  </div>
</div>

<logo-box [styling]="'max-width: 50px;'"></logo-box>

<div *ngIf="showInvoice">
    <br />
  <div class="section" style="background: #ffffffad; margin: 2rem; border-radius: 15px; width: fit-content; margin: auto;">
    <lib-invoice [data]="data"></lib-invoice>
  </div>
  <br />
  <br />
</div>

<div *ngIf="!showInvoice" class="section">
  <h1 style="text-align: center;">
    <span>Review Order</span>
  </h1>
  <p style="text-align: center;">
    Secure Checkout Powered By <a href="https://stripe.com/"><img src="assets/Stripe-Logo.jpg" alt="Stripe Logo"
        style="width: 2em; height: 1em; vertical-align: middle;"></a><ion-icon [icon]="lockClosed"></ion-icon>
  </p>
  <br />
  <div style="display: flex; flex-wrap: wrap; width: 100%;">
    <app-cart class="MainBoxItem" style="flex: 1;"></app-cart>
    <br />

    <div class="section MainBoxItem" style="flex: 2;">
      <h1>Billing Info</h1>
      <form [formGroup]="form" (submit)="handlePayment($event)">
        <!-- <h3>Customer Information</h3> -->
        <form-creator [InputItem]="{ Title: 'First Name & Last Name (Bill to)', Name: 'name', Type: 'text', Vars: [], Style: '', Category: 'Test', Placeholder: '' }" [formGroup]="form"></form-creator>
        <br />

        <form-creator [InputItem]="{ Title: 'Address', Name: 'address', Type: 'text', Vars: [], Style: '', Category: 'Test', Placeholder: '' }" [formGroup]="form"></form-creator>
        <br />

        <form-creator [InputItem]="{ Title: 'City', Name: 'city', Type: 'text', Vars: [], Style: '', Category: 'Test', Placeholder: '' }" [formGroup]="form"></form-creator>
        <br />

        <form-creator [InputItem]="{ Title: 'Country', Name: 'country', Type: 'select', Vars: applicableCountries, Style: '', Category: 'Test', Placeholder: '' }" [formGroup]="form"></form-creator>
        <br />

        <div *ngIf="form.get('country')?.value === 'US'">
          <form-creator [InputItem]="{ Title: 'Zip/Postal Code', Name: 'zip2', Type: 'text', Vars: [], Style: '', Category: 'Test', Placeholder: '' }" [formGroup]="form"></form-creator>
          <br />
        </div>

        <label for="state">State</label>
        <select id="state" formControlName="state" required [ngClass]="{'is-invalid': this.formFunctions.isInvalid(form.get('state'))}" (change)="onStateChange($event);">
          <formErrorMessage [control]="form.get('state')"></formErrorMessage>
          <option value="" disabled selected>Select State</option>
          <option value="Other">Other</option>
          <option *ngFor="let state of (form.get('country')?.value === 'US' ? USStates : GERMANStates)" [value]="state"> {{ state }} </option>
        </select>
        <br />

        <div *ngIf="showOtherStateInput">
          <input type="text" formControlName="otherState" placeholder="Enter your state" [ngClass]="{'is-invalid': this.formFunctions.isInvalid(form.get('otherState'))}">
          <formErrorMessage [control]="form.get('otherState')"></formErrorMessage>
          <br />
        </div>
        

        <form-creator [InputItem]="{ Title: 'Promo Code', Name: 'promoCode', Type: 'text', Vars: [], Style: '', Category: 'Test', Placeholder: '' }" [formGroup]="form"></form-creator>
        <br />

        <h3>
          Payment Information | Powered by <a href="https://stripe.com/"><img src="assets/Stripe-Logo.jpg" alt="Stripe Logo" style="width: 2em; height: 1em; vertical-align: middle;"></a><ion-icon [icon]="lockClosed"></ion-icon>
        </h3>
        <div id="cardElement"></div>
        <div *ngIf="cardError" class="error">{{ cardError }}</div>
        <br />
        <div style="display: flex; justify-content: flex-start;">
          <input style="width: 30px;" id="same-as-address" name="same-as-address" type="checkbox" checked>
          <label for="same-as-address">Shipping same as customer address</label>
        </div>
        <br />
        <!-- <button id="place-order-button" type="submit" [disabled]="!cardComplete">
          Place order
        </button> -->
        <button type="submit" [disabled]="!cardComplete">
          Place order
        </button>
      </form>
    </div>
  </div>
</div>

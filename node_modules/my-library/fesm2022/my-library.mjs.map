<div class="section">
    <div>
        <h1>
            <span>
                Reset Your Password
            </span>
        </h1>
        <h3>
            Enter your new password or <a class="a" (click)="requestPassLink()"> request a reset link</a>.
        </h3>
        <br />
        
        
        <form [formGroup]="NewPassform" (ngSubmit)="onSubmit()">
            <input type="text" name="website" style="display: none;">

            <div style="display: flex;">
                <input aria-label="Password input field" type="{{ ShowPassword ? 'text' : 'password' }}" formControlName="passre" [ngClass]="{'is-invalid': this.FormService.isInvalid(NewPassform.get('passre'))}" placeholder="Password" />
                
                <div style="margin: auto 0px; display: flex;" class="pass_hi" (click)="togglePasswordVisibility()">
                    <a alt="view/hide password" title="view/hide password">
                        <span *ngIf="ShowPassword == false" class="material-symbols-outlined">
                            <ion-icon size="large" [icon]="eye_outline"></ion-icon>
                        </span>
                        <span *ngIf="ShowPassword == true" class="material-symbols-outlined">
                            <ion-icon size="large" [icon]="eye_off_outline"></ion-icon>
                        </span>
                    </a>
                </div>
            </div>
            <formErrorMessage [control]="NewPassform.get('passre')"></formErrorMessage>

            <br />
            <div style="display: flex;">
                <input aria-label="Password verification input field" type="{{ ShowPassword2 ? 'text' : 'password' }}" formControlName="passre2" [ngClass]="{'is-invalid': this.FormService.isInvalid(NewPassform.get('passre2'))}" placeholder="Re-Type Password" />
                
                <div style="margin: auto 0px; display: flex;" class="pass_hi" (click)="togglePasswordVisibility2()">
                    <a alt="view/hide password" title="view/hide password">
                        <span *ngIf="ShowPassword2 == false" class="material-symbols-outlined">
                            <ion-icon size="large" [icon]="eye_outline"></ion-icon>
                        </span>
                        <span *ngIf="ShowPassword2 == true" class="material-symbols-outlined">
                            <ion-icon size="large" [icon]="eye_off_outline"></ion-icon>
                        </span>
                    </a>
                </div>
            </div>
            <formErrorMessage [control]="NewPassform.get('passre2')"></formErrorMessage>
            <formErrorMessage [control]="NewPassform"></formErrorMessage>
            <br />
            
            <button aria-label="Submit button" [disabled]="NewPassform.invalid" type="submit" class="button button2" style="padding-right: 1rem; font-size: 1.5rem;">
                <span class="material-symbols-outlined">
                    <ion-icon size="large" [icon]="key_outline"></ion-icon>
                </span>
                Reset Password
            </button>
        </form>
    </div>

</div>

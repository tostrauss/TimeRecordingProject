<background></background>
<div *ngIf="routeView === routeURL.ecommerce.path || !routeView">
    <ec-shop-view></ec-shop-view>
</div>
<div *ngIf="routeView === routeURL.cart.path">
    <app-cart></app-cart>
</div>
<div *ngIf="routeView === routeURL.productView.path">
    <ec-product-view></ec-product-view>
</div>
<div *ngIf="routeView === routeURL.productTier.path">
    <ec-product-tier></ec-product-tier>
</div>
<div *ngIf="routeView === routeURL.checkout.path">
    <app-checkout></app-checkout>
</div>

<div class="profile-photo-container" [ngStyle]="photoStyle" (click)="profile()">
  <ng-container *ngIf="(isLoading$ | async) === false; else loading">
    <form class="profile_up" *ngIf="Type === 'edit'" method="post" enctype="multipart/form-data">
      <div style="width: 100%; height: 100%;" (click)="openFileInput()">
        <ion-icon [icon]="photoUploadIcon" class="PhotoIcon"></ion-icon>
        <input type="file" #fileInput accept="{{AllowedFileTypes}}" (change)="onFileSelected($event)"
          style="display: none;">
        <p class="EditLabel">
          Only {{AllowedFileTypes}} Allowed
        </p>
      </div>
    </form>

  </ng-container>
  <ng-template #loading>
    <div class="loading-indicator">
      <p>Loading...</p>
    </div>
  </ng-template>
</div>

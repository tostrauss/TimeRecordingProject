<div class="user-grid-body">
  <div class="fixed-header">
    <div class="header-content">
      <div class="search-bar">
        <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="Search users...">
      </div>
    </div>
    <div class="scrollbar-container horizontal">
      <div class="arrow left" (click)="scrollLeft()">◀</div>
      <div class="scrollbar-track" (click)="jumpTo($event)">
        <div
          class="scrollbar-thumb"
          [style.width.px]="thumbWidth"
          [style.left.px]="thumbLeft"
          (mousedown)="startDrag($event)"
          (click)="$event.stopPropagation()"
        ></div>
      </div>
      <div class="arrow right" (click)="scrollRight()">▶</div>
    </div>    
  </div>

  <div class="scrollable-content" #scrollableContent>
    <table class="user-grid">
      <thead>
        <tr>
          <th class="sticky-column">Edit</th>
          <th class="sticky-column">First Name</th>
          <th class="sticky-column">Last Name</th>
          <th class="sticky-column">Email</th>
          <th *ngFor="let key of displayedKeys.slice(3)">
            {{ key }}
            <div class="filter-controls">
              <button (click)="toggleSort(key)" class="sort-button">
                {{ getSortIcon(key) }}
              </button>
              <select *ngIf="isGroupable(key)" [(ngModel)]="groupFilters[key]" (change)="applyFilters()">
                <option value="">All</option>
                <option *ngFor="let value of getUniqueValues(key)" [value]="value">{{ value }}</option>
              </select>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td class="sticky-column actions-column">
            <button class="edit-button" (click)="editUser(user)" (click)="$event.stopPropagation()">
              <i class="fas fa-pen"></i>
            </button>
          </td>
          <td class="sticky-column">{{ user.firstname }}</td>
          <td class="sticky-column">{{ user.lastname }}</td>
          <td class="sticky-column">
            <button class="email-button" (click)="share_(user.Email)">Email</button>
            {{ user.Email }}
          </td>
          <td *ngFor="let key of displayedKeys.slice(3)" (click)="editField(user, key)">
            <ng-container *ngIf="editingFields?.userId !== user.ID || editingFields?.key !== key; else editInput">
              <span class="truncate">{{ user[key] }}</span>
            </ng-container>
            <ng-template #editInput>
              <textarea 
              [value]="user[key] ?? ''" 
              (input)="autoResizeTextarea($event)"
              (blur)="updateField(user, key, $event)"
              (keyup.enter)="updateField(user, key, $event)"
              (click)="autoResizeTextarea($event)"
              (click)="$event.stopPropagation()"
              class="inline-edit-input"
              autoFocus
              ></textarea>
            </ng-template>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div *ngIf="editingUser" class="edit-form-overlay">
    <div class="edit-form-container">
      <h3>Edit User</h3>
      <form [formGroup]="editForm" (ngSubmit)="saveUser()">
        <div *ngFor="let control of editForm.controls | keyvalue" class="form-field">
          <label [for]="control.key">{{ control.key }}:</label>
          <input [id]="control.key" [formControlName]="control.key" [placeholder]="control.key">
          <div *ngIf="editForm.get(control.key)?.invalid && (editForm.get(control.key)?.dirty || editForm.get(control.key)?.touched)" class="error-message">
            Please enter a valid {{ control.key }}.
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" [disabled]="editForm.invalid">Save</button>
          <button type="button" (click)="cancelEdit()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

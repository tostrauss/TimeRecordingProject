<div class='cart-item' *ngIf="!hide" >
    <!-- subtract -->
    <button class="minus" (click)="updateQuantity(id, '-')">-</button>
    <!-- set -->
    <input type="number" id="numberInput" (change)="updateC(id, $event)" [placeholder]="getQuantity(id)">
    <!-- add -->
    <button class="plus" (click)="updateQuantity(id, '+')">+</button>
</div>

<form [formGroup]="Account_Edit_Form" (ngSubmit)="onSubmit()">
    <input type="text" formControlName="website" style="display: none;">
    <h3>
        Login / Email
    </h3>
    <input type="email" formControlName="eemail" placeholder="Enter Email (used as your official login)" minlength="7"
        maxlength="85" title="Your Email (used as your official login)" required (keyup)="CheckExi('eemail','email')"
        [ngClass]="{'is-invalid': this.FormService.isInvalid(Account_Edit_Form.get('eemail'))}" />

    <formErrorMessage [control]="Account_Edit_Form.get('eemail')"></formErrorMessage>
    <br />
    <h3>
        User Handle
    </h3>
    <input type="text" formControlName="dispName" placeholder="Enter your PUBLIC username..."
        title="Your public username" minlength="3" maxlength="50" required
        (ngModelChange)="CheckExi('dispName','disname')"
        [ngClass]="{ 'is-invalid': this.FormService.isInvalid(Account_Edit_Form.get('dispName'))}" />
    <formErrorMessage [control]="Account_Edit_Form.get('dispName')"></formErrorMessage>
    <br />

    <h3>
        Reset Password
    </h3>

    <button type="button" aria-label="Generate password button" (click)="resetPass()" class="button"
        style="padding-right: 1rem; font-size: 1.5rem; margin-right: 0.5rem;">
        <span>
            <ion-icon size="small" [icon]="key_outline"></ion-icon>
        </span>
        ************
    </button>
    <br />
    <br />
    

    <h3>
        First Name / Last Name
    </h3>
    <p style="color: red;">
        *To edit, please visit our support page to send a name edit request.
    </p>
    <input style="width: 100%;" type="text" minlength="3" maxlength="40" placeholder="Your First Name..."
        pattern="[a-zA-Z]+" title="Enter your first name..." required formControlName="firstName"
        aria-label="First Name input field"
        [ngClass]="{ 'is-invalid': this.FormService.isInvalid(Account_Edit_Form.get('firstName'))}">
    <formErrorMessage [control]="Account_Edit_Form.get('firstName')"></formErrorMessage>
    <br />


    <input style="width: 100%;" type="text" minlength="3" maxlength="40" placeholder="Your Last Name..."
        pattern="[a-zA-Z]+" title="Enter your last name..." required formControlName="lastName"
        aria-label="Last Name input field"
        [ngClass]="{ 'is-invalid': this.FormService.isInvalid(Account_Edit_Form.get('lastName'))}">
    <formErrorMessage [control]="Account_Edit_Form.get('lastName')"></formErrorMessage>
    <br />
    <br />

    <div class="has-text-right">

        <app-loadingspinner></app-loadingspinner>
        <div style="display: flex; justify-content: space-between;">
            <button type="submit" aria-label="Create account button" [disabled]="Account_Edit_Form.invalid"
                type="submit" class="button button2" style="padding-right: 1rem; font-size: 1.5rem;">
                <span>
                    <ion-icon size="large" [icon]="log_in_outline"></ion-icon>
                </span>
                Save Changes
            </button>
            <button type="button" (click)="requestDelete()" class="button buttonR">
                <span>
                    <ion-icon size="large" [icon]="closeCircle"></ion-icon>
                </span>
                Delete Account
            </button>
        </div>
    </div>
    <br />
</form>

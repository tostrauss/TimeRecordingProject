<form [formGroup]="LoginForm" (ngSubmit)="onSubmit()">
    <h1>
        <span>
            Welcome Back!
        </span>
    </h1>
    <h3>
        Enter your credentials to <b>login</b>.
    </h3>
    <br />
    <input type="text" formControlName="website" style="display: none;">
    <input type="email" autocomplete="email"
        [ngClass]="{'is-invalid': this.FormService.isInvalid(LoginForm.get('usemal'))}" formControlName="usemal"
        placeholder="Email" />
    <formErrorMessage [control]="LoginForm.get('usemal')"></formErrorMessage>
    <br />

    <div style="display: flex;">
        <input autocomplete="current-password" type="{{ ShowPassword ? 'text' : 'password' }}" formControlName="pqwrd"
            [ngClass]="{'is-invalid': this.FormService.isInvalid(LoginForm.get('pqwrd'))}" placeholder="Password" />

        <div style="margin: auto 0px; display: flex;" class="pass_hi" (click)="togglePasswordVisibility()">
            <a alt="view/hide password" title="view/hide password">
                <!-- visibility -->
                <ion-icon class="EyeIcon" *ngIf="ShowPassword == false" size="large" [icon]="eye_outline"></ion-icon>
                <!-- visibility_off -->
                <ion-icon class="EyeIcon" *ngIf="ShowPassword == true" size="large" [icon]="eye_off_outline"></ion-icon>
            </a>
        </div>
    </div>
    <formErrorMessage [control]="LoginForm.get('pqwrd')"></formErrorMessage>

    <br />
    <div style="display: flex; padding: 0.5rem; justify-content: flex-start;">
        <input type="checkbox" formControlName="rememberme" style="max-height: 10px; width: min-content; margin: auto 0px;" />
        <span style="cursor: pointer;">
            Stay logged in | <a class="button"
                (click)="this.router.navigate(['/'+this.view.forgotPassword.path])">Forgot your password?</a>
        </span>
    </div>

    <br />
    <div style="text-align: right;">
        <!-- <hr style="background: var(--color)"> -->
        <app-loadingspinner></app-loadingspinner>
        <button *ngIf="!HideLogin" aria-label="Sign in button" type="submit" class="button button2"
            style="padding-right: 1rem; font-size: 1.5rem;">
            <ion-icon size="large" [icon]="log_in_outline"></ion-icon>
            Sign In
        </button>
    </div>
</form>

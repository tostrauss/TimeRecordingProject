<div [formGroup]="formGroup" *ngIf="InputItem">
    <label [style]="labelStyle">{{ InputItem.Title }}</label><span style="margin-left: 5px;">{{InputItem.Span}}</span>
    <div [ngSwitch]="InputItem.Type">
        <input *ngSwitchCase="'text'" type="text" [formControlName]="InputItem.Name"
            [ngClass]="{'is-invalid': isInvalid(formGroup.get(InputItem.Name))}" [placeholder]="InputItem.Placeholder"
            [style]="InputItem.Style" />
        <textarea *ngSwitchCase="'textarea'" [formControlName]="InputItem.Name"
            [ngClass]="{'is-invalid': isInvalid(formGroup.get(InputItem.Name))}" [placeholder]="InputItem.Placeholder"
            [style]="InputItem.Style"></textarea>
        <select *ngSwitchCase="'select'" [formControlName]="InputItem.Name"
            [ngClass]="{'is-invalid': isInvalid(formGroup.get(InputItem.Name))}" [style]="InputItem.Style">
            <option *ngFor="let option of InputItem.Vars" [value]="option">{{ option }}</option>
        </select>
        <input *ngSwitchCase="'number'" type="number" [formControlName]="InputItem.Name"
            [ngClass]="{'is-invalid': isInvalid(formGroup.get(InputItem.Name))}" [style]="InputItem.Style">
        <div *ngSwitchCase="'video'">
            <div *ngIf="showVideo; else NoVideo">
                <app-videodisplay [videoLink]="videoLink"></app-videodisplay>
            </div>
            <ng-template #NoVideo>
                <app-videodisplay [videoLink]="videoLink ?? InputItem.Placeholder"></app-videodisplay>
                <!-- <p>
                    Showing {{InputItem.Placeholder}} as a placeholder video.
                </p> -->
            </ng-template>

            <br />
            <input [formControlName]="InputItem.Name" type="text" [value]="InputItem.Placeholder" (input)="onInputChange($event)" [ngClass]="{'is-invalid': isInvalid(InputItem.Placeholder)}">
            <p>
              *For best results, use YouTube Links.
            </p>
        </div>
        <div *ngSwitchCase="'picture'">
            <profilePhoto [Type]="'edit'" class="ProfilePhotoBox"></profilePhoto>
        </div>
    </div>
    <formErrorMessage [control]="formGroup.get(InputItem.Name)"></formErrorMessage>
</div>

<div *ngIf="loginTrue == null">
<form [formGroup]="RegForm" (ngSubmit)="CheckExi('nusemal','email')" >
    <logo-box [styling]="'width: 50px;'"></logo-box>
    <h1>
        <span>
            Account Access Required
        </span>
    </h1>
    <h3>
        That page is restricted! Enter your email to gain access ...
    </h3>
    <br />

    <input type="text" formControlName="website" style="display: none;">
    <input 
        type="email" 
        formControlName="nusemal" 
        placeholder="Enter your Email"
        minlength="7" 
        maxlength="85" 
        title="Your Email"
        required
        [ngClass]="{'is-invalid': this.FormService.isInvalid(RegForm.get('nusemal'))}" 
         /><formErrorMessage [control]="RegForm.get('nusemal')"></formErrorMessage>
         <p>
            *Not used for spam email lists or sold to third parties.
         </p>
    <!-- <p>
            *When handling sensitive information we utilize industry standards as well as additional security measures. For more information <a class="a" (click)="openPrivacy()">click here</a>
    </p> -->
    

    <div class="has-text-right">
        <hr style="background: var(--color)">
        <app-loadingspinner></app-loadingspinner> 
        <button aria-label="Create account button" type="submit" class="button button2" style="padding-right: 1rem; font-size: 1.5rem;">
            <ion-icon size="large" [icon]="log_in_outline"></ion-icon>
            Continue
        </button>
    </div>
</form>
</div>
<div>
    <div class="AddSectionPad" *ngIf="loginTrue">
        <login-form [defaultEmail]="defaultEmail"></login-form>
    </div>
    <div class="AddSectionPad" *ngIf="loginTrue == false">
        <login-signupform [defaultEmail]="defaultEmail"></login-signupform>
    </div>
</div>

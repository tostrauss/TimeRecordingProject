<div class="ProductViewBox">
    <h1>{{this.product.Title}}</h1>
    <p>{{this.product.Description}}</p>
    <br />
    <div *ngIf="ShowCategories" style="display: inline-flex; flex-wrap: wrap;" >
        <p style="margin: auto; color: grey; font-style: italic;">
            Categories:
        </p>
        <p *ngFor="let key of this.product.Keywords" class="tag">{{key}}</p>
        <br />
    </div>
    
    <!-- <hr> -->
    <ec-product-tier [Product]="product" [CustomPackages] = "this.CustomPackages"></ec-product-tier>
    <br />
</div>

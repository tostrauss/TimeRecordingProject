<div class="error-container">
  <div *ngIf="showError">
    <div *ngIf="ErrorData" class="error-message" @slideInOut [@slideInOut]="animationState"
      [ngClass]="{'error-success': ErrorData.Success, 'error-errorred': !ErrorData.Success}">
      <span class="error-text">{{ErrorData.Message}}</span>
      <span class="close-button" (click)="closeError()">X</span>
    </div>
  </div>
</div>

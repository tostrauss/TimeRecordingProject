<div class="section">

    <app-loadingspinner></app-loadingspinner> 

    <div>
        <h1>
            <span>
                Password Recovery
            </span>
        </h1>
        <h3>
            Enter your login email, and check your inbox for a reset link.
        </h3>
        <br />
        
        <form [formGroup]="PassResetForm" (ngSubmit)="onSubmit()">
            <input type="text" name="website" style="display: none;">
            <input aria-label="Email input field" type="email" [ngClass]="{'is-invalid': this.FormService.isInvalid(PassResetForm.get('usepass'))}" formControlName="usepass" placeholder="Email" />
            <formErrorMessage [control]="PassResetForm.get('usepass')"></formErrorMessage>
            <br />
            <button aria-label="Submit button" type="submit" class="button button2" style="padding-right: 1rem; font-size: 1.5rem;">
                <span class="material-symbols-outlined">
                    <ion-icon size="large" [icon]="email_outline"></ion-icon>
                </span>
                Send Reset Link
            </button>
        </form>
    </div>

</div>

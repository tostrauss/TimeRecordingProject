<div style="padding: 2rem; background: white;">
    <br />
    <br />
    <div>
        <h1>Available Services</h1>
        <h2>Browse our selection of available services below</h2>
    </div>
    <br />
    <br />
</div>

<div class="BackgroundPattern">
    <ec-sidecart></ec-sidecart>
    <ec-shop-nav></ec-shop-nav>
</div>

<div class="CategoryDisplay" *ngFor="let Category of NavItems">
    <br />
    <h1 [id]="this.Category">
        {{ this.Category }}
    </h1>
    
    <div class="Products_Display" *ngFor="let service of filterServices(Category)">
        <div class="Product_Info" (click)="ViewProductInfo(service.ID)">
            <h3>{{ service.Title}}</h3>
            <p>{{ service.Description }}</p>
        </div>
        <input class="is-primary" type="button" value="Add to Cart" (click)="addToCart(service)">
    </div>
</div>

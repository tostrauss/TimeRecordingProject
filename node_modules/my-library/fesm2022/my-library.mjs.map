<div *ngIf="data" class="invoice-info"
  style="display: flex; flex-direction: column; align-items: center; padding: 20px; width: 100%; max-width: 800px; margin: 0 auto;">
  <h2 style="font-size: 2em; margin-bottom: 20px;">
    Order Details
  </h2>
  <p>
    <strong>Order ID:</strong> {{ data.payment_method }}
  </p>
  <hr>

  <!-- Contact Info Section -->
  <div class="info-section">
    <h3 style="font-size: 1.5em; margin-bottom: 10px;">Contact Info</h3>
    <p>
      <strong>Name:</strong> {{ data.name }}
    </p>
    <p>
      <strong>Email:</strong> {{ data.email }}
    </p>
  </div>
  <hr>

  <!-- Payment Method Section -->
  <div class="info-section">
    <h3 style="font-size: 1.5em; margin-bottom: 10px;">
      Payment Method
    </h3>
    <p>
      <strong>{{ data.cardBrand }} ending in</strong> {{ data.last4 }}</p>
  </div>
  <hr>

  <!-- Billing Address Section -->
  <div class="info-section">
    <h3 style="font-size: 1.5em; margin-bottom: 10px;">Billing Address</h3>
    <p *ngFor="let item of billingAddress">
      <strong>{{ item.key | titlecase }}:</strong> {{ item.value }}
    </p>
  </div>

  <!-- <button class="is-primary" (click)="print()">Print Invoice</button> -->
  <button class="is-primary" (click)="home()">Finish</button>
</div>

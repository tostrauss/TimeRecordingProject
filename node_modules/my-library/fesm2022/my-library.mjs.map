<div class="BackgroundPatternOverlay">
    <div (click)="Cart_Display()" class="SideNavButton" onload="loadSideNavCart()">
        <p>
            <button class="button button2"><</button>
        </p>
    </div>

    <div class="sideNavCart" [ngClass]="{'sideNavCart_open ': ShowCart, '': !ShowCart}">
        <div class="SideNavTitle">
            <p (click)="Cart_Display()" class="SideNavButton">
                <button class="button button2">></button>
            </p>
            <h4 style="margin-left: 20px;">
                My Selection | {{ Total | currency }}
            </h4>
        </div>
        <ec-itemsdisplay></ec-itemsdisplay>
    </div>
</div>


<div *ngIf="safeVideoLink; else NoVideo">
  <div *ngIf="VideoSrc == 'External'">
    <div class="video-container">
      <iframe id="videoautogen" [src]="safeVideoLink" frameborder="0"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen [attr.autoplay]="autoplay ? '' : null"></iframe>
    </div>
  </div>
  <div *ngIf="VideoSrc == 'Internal'">
    <div class="video-container2">
      <video class="video_" controls [attr.autoplay]="autoplay ? '' : null">
        <source id="videoautogen" [src]="safeVideoLink" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
</div>
<ng-template #NoVideo>
  <div class="video-container">
    <h3 class="centered-text">
      No Video Available
      <br />
      <ion-icon [icon]="VideoIcon"></ion-icon>
    </h3>
  </div>
</ng-template>

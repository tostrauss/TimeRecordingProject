<div class="">
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" style="padding: 1rem;" class="">

        <input type="text" name="email_confirm" style="display: none;">
        <div>
            <label class="label ">Your Name
            </label>
            <input type="text" [placeholder]="'J Smith'" formControlName="name"
                [ngClass]="{ 'is-invalid': this.FormService.isInvalid(contactForm.get('name'))}">
            <formErrorMessage [control]="contactForm.get('name')"></formErrorMessage>
        </div>
        <br />
        <div>
            <label class="label">
                Email
                <span style="font-size: 10px;">
                    (we will send a response to this address)
                </span>
            </label>

            <input type="email" placeholder="firstname@tetech.website..." name="emailTO" formControlName="emailTO"
                [ngClass]="{ 'is-invalid': this.FormService.isInvalid(contactForm.get('emailTO'))}">

                <formErrorMessage [control]="contactForm.get('emailTO')"></formErrorMessage>
        </div>

        <br />
        <div>
            <label class="label">Your Message</label>
            <textarea style="width: 100%; padding: 0.5rem;" rows="6" id="message" formControlName="message"
                maxlength="200" minlength="3" title="Maximum 200 characters allowed" required
                placeholder="Hi! I'd like to speak with someone in regards to..."
                [ngClass]="{ 'is-invalid': this.FormService.isInvalid(contactForm.get('message'))}">
            </textarea>
        </div>
        <br />
        
        <button type="submit" class="is-primary" button is-large>
            <i class="fa fa-envelope" aria-hidden="true"></i> Send
        </button>
    </form>

</div>

<!-- Header_UnderLay -->
<div class="" *ngIf="Show">
    <div class="Header">
        <div class="Header__logo" (click)="home()">
            <!-- <img style="border-radius: 0.5rem;" src="{{logo}}" alt="Logo" /> -->
            <logo-box [styling]="'width: auto; max-height: 35px;'"></logo-box>
            <h4 style="margin: auto;">
                {{title}}
            </h4>
        </div>

        <div class="Header__user" *ngIf="isLoggedIn; else PublicHeader;">
            <div style="display: flex;">
                <!-- <app-clock *ngIf="(User.verified && User.verified_dur); else getverified;" (click)="verified_()"
                    [clock]="User.verified" [duration]="User.verified_dur" style="margin: auto;"></app-clock> -->
                <ng-template #getverified>
                    <!-- <div style="color: white; margin: auto; margin-left: 0.5rem; cursor: pointer; width: 50px;"
                        (click)="verified_()">
                        <verified-icon [Verified]="User.Verified"></verified-icon>
                    </div> -->
                </ng-template>

                <div class="Header__user__avatar">
                    <profilePhoto [AllowGoToProfile]="true" [Type]="'view'" [style]="{'width': '2.5rem', 'height': '100%', 'border-radius': '100%'}">
                    </profilePhoto>
                </div>
                <div style="color: var(--Color); margin: auto 0.75rem; margin-top: 0.25em; cursor: pointer;"
                    (click)="toggleDropdown()">
                    <ion-icon [icon]="appsOutline" slot="end" style="font-size: 1.5rem;"></ion-icon>
                </div>

                <div id="dropdownMenu" class="dropdown-menu">
                    <div *ngFor="let option of SettingDropdownOptions">
                        <div class="menu-item" (click)="option.func()">
                            <ion-icon *ngIf="option.Icon" [name]="option.Icon"></ion-icon>
                            <a>{{ option.Title }}</a>
                        </div>
                    </div>
                </div>


                <!-- <div class="Header__user__name" (click)="profile_()">
                    <ion-icon [icon]="settings" slot="end"></ion-icon>
                    <span>{{" " + User.firstname + " " + User.lastname}} </span>
                </div> -->
                <!-- <ion-icon [icon]="chat" style="color: white; margin: auto; margin-left: 0.5rem;" slot="end"
                    (click)="messages_()"></ion-icon> -->
            </div>
        </div>
        <ng-template #PublicHeader>
            <login-button style="margin: auto 0px; margin-right: 0.25em;"></login-button>
        </ng-template>
    </div>
</div>

    <div class="loading-spinner">
      <logo-box class="Spin" [styling]="'width: 50px; margin: auto;'" [AltText]="'Loading...'" ></logo-box>
      <!-- <img class="Spin" style="height: 50px; width: 50px;" [src]="Photo" alt="Loading..." /> -->
      <p>Loading...</p>
    </div>
  </div>

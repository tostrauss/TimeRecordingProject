<!-- top bar for each setting -->
<background></background>

<div class="SettingsTopBar">
    <ion-icon *ngIf="routeView !== routeKey.settings.path " style="margin: auto 0px;" [icon]="arrowright" slot="end"
        (click)="setViewState(routeKey.settings.path )"></ion-icon>
    <div style="display: flex;">
        <h5 (click)="setViewState(routeKey.settings.path )" style="margin: auto; cursor: pointer; font-size: 1.2rem;">
            Settings |
        </h5>
        <p style="font-size: 1rem; margin: auto; margin-left: 0.5rem; color: var(--color)">
            {{routeView.charAt(0).toUpperCase() + routeView.slice(1)}}
        </p>
    </div>
</div>


<ng-template #loading>
    <div>Loading...</div>
</ng-template>


<div class="section2">

<!-- main panel of all settings  -->
    <div *ngIf="routeView === routeKey.settings.path  || !routeView" class="section">
        <!-- <h1>
            Settings
        </h1> -->
        <ion-list *ngIf="routeView == routeKey.settings.path  || !routeView">
            <div>
                <ion-item (click)="setViewState(routeKey.profile.path )">
                    <ion-label>Edit Profile</ion-label>
                    <ion-icon [icon]="arrowleft" slot="end"></ion-icon>
                </ion-item>
            </div>
            <ion-item (click)="setViewState(routeKey.account.path )">
                <ion-label>Account Information</ion-label>
                <ion-icon [icon]="arrowleft" slot="end"></ion-icon>
            </ion-item>
            <!-- <ion-item (click)="setViewState(SubStates[3])">
                <ion-label style="color: gold;">Get Verified <ion-icon [icon]="star" slot="end"></ion-icon></ion-label>
                <ion-icon [icon]="arrowleft" slot="end"></ion-icon>
            </ion-item> -->
            <ion-item (click)="setViewState(routeKey.help.path )">
                <ion-label>Help</ion-label>
                <ion-icon [icon]="arrowleft" slot="end"></ion-icon>
            </ion-item>
            <!-- additional settings -->
            <div *ngIf="additionalSettings">
                <div *ngFor="let s of additionalSettings">
                    <ion-item (click)="setViewState(s.path)">
                        <ion-label>{{s.path}}</ion-label>
                        <ion-icon [icon]="arrowleft" slot="end"></ion-icon>
                    </ion-item>
                </div>
            </div>
            <ion-item (click)="setViewState(routeKeyLogin.logout.path )">
                <ion-label style="text-align: right;">Logout</ion-label>
                <ion-icon [icon]="arrowleft" slot="end"></ion-icon>
            </ion-item>
        </ion-list>
    </div>

    <div *ngIf="routeView === routeKey.profile.path ">
        <settings-profile [User]="User"></settings-profile>
    </div>

    <div *ngIf="routeView === routeKey.account.path " class="section">
        <settings-account-form [User]="User"></settings-account-form>
    </div>

    <!-- <div *ngIf="View_State === SubStates[3]" class="section">
    <div *ngIf="User | async as user; else loading">
        <settings-verified [User]="User"></settings-verified>
    </div>
</div> -->

    <div *ngIf="routeView === routeKey.help.path " class="section">
        <settings-help [User]="User"></settings-help>
    </div>


</div>

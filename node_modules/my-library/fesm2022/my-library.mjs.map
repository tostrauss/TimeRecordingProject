<div class="countdown-clock" [ngStyle]="clockContainerStyle">
  <div class="timer" [ngStyle]="timerStyle">
    <div class="time-unit" [ngStyle]="timeUnitStyle">
      <p class="value" [ngStyle]="valueStyle">{{ days }}</p>
      <span class="label" [ngStyle]="labelStyle">
        {{ useLongLabels ? getDayLabel() : 'D' }}
      </span>
    </div>
    <div class="time-unit" [ngStyle]="timeUnitStyle">
      <p class="value" [ngStyle]="valueStyle">{{ hours | number:'2.0-0' }}</p>
      <span class="label" [ngStyle]="labelStyle">
        {{ useLongLabels ? getHourLabel() : 'H' }}
      </span>
    </div>
    <div class="time-unit" [ngStyle]="timeUnitStyle">
      <p class="value" [ngStyle]="valueStyle">{{ minutes | number:'2.0-0' }}</p>
      <span class="label" [ngStyle]="labelStyle">
        {{ useLongLabels ? getMinuteLabel() : 'M' }}
      </span>
    </div>
    <div class="time-unit" [ngStyle]="timeUnitStyle">
      <p class="value" [ngStyle]="valueStyle">{{ seconds | number:'2.0-0' }}</p>
      <span class="label" [ngStyle]="labelStyle">
        {{ useLongLabels ? getSecondLabel() : 'S' }}
      </span>
    </div>
  </div>
</div>

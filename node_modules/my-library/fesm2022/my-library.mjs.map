<logo-box *ngIf="fullKit || logoBox"></logo-box>
<br />
<background *ngIf="fullKit || background"></background>

<div *ngIf="routeView === routeKey.login.path || routeView === routeKey.createAccount.path  || !routeView" class="section2">
    <div class="AddSectionPad">
        <ion-segment [(ngModel)]="selectedTab" mode="ios">
            <ion-segment-button value="{{routeKey.login.path }}">
                Login
            </ion-segment-button>
            <ion-segment-button value="{{routeKey.createAccount.path }}">
                New Account
            </ion-segment-button>
        </ion-segment>

        <div [ngSwitch]="selectedTab">
            <div *ngSwitchCase="routeKey.login.path " class="AddSectionPad">
                <login-form></login-form>
            </div>
            <div *ngSwitchCase="routeKey.createAccount.path ">
                <div class="AddSectionPad">
                    <login-signupform></login-signupform>
                </div>
            </div>
        </div>
    </div>
</div>
<div *ngIf="routeView === routeKey.forgotPassword.path " class="section2 AddSectionPad">
    <login-passreset></login-passreset>
</div>
<div *ngIf="routeView === routeKey.passwordReset.path " class="section2 AddSectionPad">
    <login-newpassform></login-newpassform>
</div>
<div *ngIf="routeView === routeKey.logout.path " class="section2 AddSectionPad">
    <login-logout></login-logout>
</div>

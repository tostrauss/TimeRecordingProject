<div class="container">
    <h1>Time Recording</h1>
    <div class="loading-spinner" *ngIf="isLoading"></div>
  
    <button (click)="toggleClock()" [disabled]="isLoading">{{ clockStatus }}</button>
    <p [ngClass]="messageColor">{{ clockMessage }}</p>
  
    <form #recordForm="ngForm" (ngSubmit)="onSubmit(recordForm)">
      <div class="input-group">
        <label for="task-details">Task Details</label>
        <textarea
          id="task-details"
          name="taskDetails"
          placeholder="What did you do?"
          required
          ngModel
        ></textarea>
      </div>
      <div class="input-group">
        <label for="hours-worked">Hours Worked</label>
        <input
          type="number"
          id="hours-worked"
          name="hoursWorked"
          placeholder="Hours Worked"
          required
          min="0"
          step="0.5"
          ngModel
        />
      </div>
      <div class="input-group">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required ngModel />
      </div>
      <button type="submit" [disabled]="isLoading">Submit</button>
    </form>
    <p [ngClass]="messageColor">{{ recordMessage }}</p>

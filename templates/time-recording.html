<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Recording</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body>
  <div class="container">
    <h1>Time Recording</h1>
    <div class="loading-spinner" id="loading-spinner"></div>

    <form id="record-form">
      <div class="input-group">
        <label for="task-details">Task Details</label>
        <textarea id="task-details" placeholder="What did you do?" required></textarea>
      </div>
      <div class="input-group">
        <label for="hours-worked">Hours Worked</label>
        <input type="number" id="hours-worked" placeholder="Hours Worked" required min="0" step="0.5">
      </div>
      <div class="input-group">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
      <button type="submit" id="record-button">Submit</button>
    </form>
    <p id="record-message" aria-live="polite"></p>
  </div>

  <script>
    document.getElementById('record-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const taskDetails = document.getElementById('task-details').value.trim();
      const hoursWorked = parseFloat(document.getElementById('hours-worked').value);
      const date = document.getElementById('date').value;

      if (!taskDetails || isNaN(hoursWorked) || !date) {
        document.getElementById('record-message').textContent = 'Please complete all fields!';
        return;
      }

      document.getElementById('loading-spinner').style.display = 'block';

      try {
        const response = await fetch('/add_record', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: 1, // Mock user_id
            task_details: taskDetails,
            hours_worked: hoursWorked,
            date,
            clock_in: new Date().toISOString(),
            clock_out: new Date().toISOString(),
          }),
        });

        const result = await response.json();
        if (response.ok) {
          document.getElementById('record-message').textContent = 'Record added successfully!';
          document.getElementById('record-form').reset();
        } else {
          document.getElementById('record-message').textContent = 'Failed to add record!';
        }
      } catch (error) {
        document.getElementById('record-message').textContent = 'An error occurred!';
        console.error(error);
      } finally {
        document.getElementById('loading-spinner').style.display = 'none';
      }
    });
  </script>
</body>
</html>

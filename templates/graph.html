<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Hours Overview</title>
  //
  bootstrap?
  <link rel="stylesheet" href="static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Work Hours Overview</h1>
  <div class="chart-container">
    <canvas id="hoursChart"></canvas>
  </div>
  <p id="graph-message" class="message"></p>

  <script>
    async function loadGraphData() {
      try {
        const response = await fetch('/get_records', { method: 'GET' });
        if (response.ok) {
          const records = await response.json();
          if (records.length === 0) {
            document.getElementById('graph-message').textContent = 'No records found.';
            return;
          }

          const labels = records.map(record => record.date);
          const data = records.map(record => record.hours_worked);

          const ctx = document.getElementById('hoursChart').getContext('2d');
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'Hours Worked',
                data,
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1,
              }],
            },
            options: {
              responsive: true,
              plugins: {
                title: {
                  display: true,
                  text: 'Work Hours Overview',
                },
              },
              scales: {
                x: { title: { display: true, text: 'Date' } },
                y: { beginAtZero: true, title: { display: true, text: 'Hours Worked' } },
              },
            },
          });
        } else {
          document.getElementById('graph-message').textContent = 'Failed to load data.';
        }
      } catch (error) {
        console.error('Error loading graph data:', error);
        document.getElementById('graph-message').textContent = 'An error occurred.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadGraphData);
  </script>
</body>
</html>
